# GitHub Actions workflow: build + package + publish an Obsidian Community Plugin release.
#
# Triggered when a SemVer tag is pushed to the remote. Two patterns are
# accepted for compatibility:
#   - `0.2.1` (recommended) — matches Obsidian community directory
#     expectations (no `v` prefix; see https://docs.obsidian.md/Plugins/Releasing/Submit+your+plugin)
#   - `v0.2.1` (legacy) — kept for older habits / pre-v0.2.1 history
#   - `v0.3.0-rc1` (prerelease) — softprops recognizes `pre`/`rc`/`beta` segments
#
# The workflow:
#   1. Installs pnpm dependencies (frozen lockfile, deterministic).
#   2. Runs the production build (esbuild bundles src/main.ts -> main.js).
#   3. Packages main.js + manifest.json + styles.css into a versioned zip
#      (filename derived from manifest.json so we don't hard-code the version).
#   4. Creates / updates a GitHub Release for the tag and attaches the zip
#      plus the three raw plugin files so users can grab either form.
#
# Required secrets / permissions:
#   - `GITHUB_TOKEN` — automatically provided by GitHub Actions; no manual
#     setup needed. `softprops/action-gh-release@v2` uses it to create the
#     release and upload assets.
#
# Notes:
#   - Version is read dynamically from `manifest.json` (`jq -r .version`), so
#     there is exactly one place to bump when cutting a release.
#   - This workflow does NOT touch `dist/` — that directory holds pre-built
#     artifacts for local manual installs. `dist/` is kept in sync with the
#     current HEAD via separate `chore: refresh dist/` commits (e.g. commit
#     `2931850`); it's unrelated to the release pipeline itself.
#   - Tag → release mapping: `softprops/action-gh-release@v2` creates a
#     release for whatever tag triggered the workflow. So `0.2.1` tag push
#     creates a `0.2.1` release (no v prefix), which is what community.obsidian.md
#     matches against `manifest.json` `version`.

name: Release

on:
  push:
    tags:
      # 接受任何 dot-separated 形式 (SemVer), 例如 0.2.1 / 1.0.0 / 0.3.0-rc.1
      # GitHub Actions tag patterns 只支持 glob, 不是 regex
      - "*.*.*"
      # 兼容 legacy v-prefixed tags (v0.2.0, v0.2.1) — 已经在用的旧 tag
      - "v*"


jobs:
  build:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required for softprops/action-gh-release to create the release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build plugin
        # tsc --noEmit --skipLibCheck ensures types still compile (esbuild
        # alone doesn't catch type errors), then esbuild bundles main.js.
        run: pnpm run build

      - name: Zip release artifacts
        # Version is pulled from manifest.json so we never hard-code "0.2.0"
        # here — bumping the plugin just means editing manifest.json + tagging.
        run: |
          version=$(jq -r .version manifest.json)
          zip ez-reader-${version}.zip main.js manifest.json styles.css

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # The release body is intentionally short — README.md has the full
          # user-facing changelog. Tag annotations are surfaced by GitHub
          # automatically. Set generate_release_notes: true if you want
          # GitHub to auto-aggregate merged PRs into the notes.
          generate_release_notes: true
          files: |
            ez-reader-*.zip
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
